name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Validate HTML
      run: |
        if command -v htmlhint &> /dev/null; then
          htmlhint **/*.html
        else
          echo "htmlhint not installed, skipping validation"
        fi
        echo "Checking HTML file exists..."
        if [ -f "index.html" ]; then
          echo "✓ index.html found"
          wc -l index.html
        else
          echo "✗ index.html missing"
          exit 1
        fi
    
    - name: Check image exists
      run: |
        if [ -f "images/destination-image.png" ]; then
          echo "✓ Destination image found"
          ls -la images/
        else
          echo "✗ Destination image missing"
          exit 1
        fi
    
    - name: Validate markdown links
      run: |
        echo "Checking for broken links in README..."
        grep -oP '(https?://[^\s)]+)' README.md | head -5

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: '.'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
