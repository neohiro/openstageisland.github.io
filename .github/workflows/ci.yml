name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required files
        run: |
          set -euo pipefail
          required=(index.md assets/style.css images/destination-image.png README.md data.json LICENSE Gemfile)
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required file"
              missing=1
            else
              size=$(wc -c < "$f")
              echo "✓ $f ($size bytes)"
            fi
          done
          [ "$missing" -eq 0 ] || { echo "One or more required files are missing"; exit 1; }

      - name: Validate HTML structure
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failures=0
          skip_dirs=( '_includes/' '_layouts/' '_site/' '.git/' )
          for f in **/*.html; do
            skip=0
            for d in "${skip_dirs[@]}"; do
              [[ "$f" == "$d"* ]] && skip=1 && break
            done
            [ "$skip" -eq 1 ] && continue
            ok=1
            if ! grep -qi "<!doctype html>" "$f"; then
              echo "::error file=$f::Missing <!DOCTYPE html>"
              ok=0
            fi
            if ! grep -q '<html[^>]*\blang=' "$f"; then
              echo "::error file=$f::Missing <html lang=...> attribute"
              ok=0
            fi
            if ! grep -q '<title>[^<]*</title>' "$f"; then
              echo "::error file=$f::Missing or empty <title>"
              ok=0
            fi
            if ! grep -q 'name="description"' "$f"; then
              echo "::error file=$f::Missing meta description"
              ok=0
            fi
            open=$(grep -oE '<section\b' "$f" | wc -l)
            close=$(grep -oE '</section>' "$f" | wc -l)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::Unbalanced <section> tags ($open open vs $close close)"
              ok=0
            fi
            if [ "$ok" -eq 1 ]; then
              echo "✓ $f passed structural checks"
            else
              failures=$((failures+1))
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures HTML file(s) failed validation"; exit 1; }

      - name: Validate JSON
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 is required but not found"; exit 1; }
          shopt -s globstar nullglob
          for f in **/*.json; do
            [[ "$f" == .git/* ]] && continue
            [[ "$f" == *".git/"* ]] && continue
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('✓ ' + sys.argv[1] + ' is valid JSON')" "$f" || exit 1
          done

      - name: Validate internal links and asset references
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r ref; do
            clean="${ref%%#*}"
            clean="${clean%%\?*}"
            clean="${clean//\"/}"
            [[ -z "$clean" ]] && continue
            [[ "$clean" =~ ^https?:// ]] && continue
            [[ "$clean" =~ ^// ]] && continue
            [[ "$clean" =~ ^secondlife:// ]] && continue
            [[ "$clean" =~ ^mailto: ]] && continue
            [[ "$clean" =~ ^data: ]] && continue
            [[ "$clean" =~ ^# ]] && continue
            if [ ! -f "$clean" ] && [ ! -d "$clean" ]; then
              echo "::warning::Broken local reference: $ref (resolves to '$clean')"
              failures=$((failures+1))
            fi
          done < <(grep -hoE '(href|src)="[^"]*"' README.md | sed -E 's/^(href|src)="//; s/"$//')
          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures potentially broken local reference(s) (review warnings above)"
          fi

      - name: Validate README markdown link syntax
        run: |
          set -euo pipefail
          if grep -nE '\[[^]]*\]\(\)' README.md; then
            echo "::error::Empty link target in README"
            exit 1
          fi
          echo "✓ README markdown links look valid"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
